[pytest]
# Single source for pytest config. It lives at the repository root, not in
# apps/api, so `pytest` works from either directory: pytest walks upward looking
# for a config file, so a run started inside apps/api finds this one too.
testpaths = apps/api/tests
pythonpath = apps/api

asyncio_mode = auto
# The engine fixture is session-scoped, and asyncpg connections cannot cross
# event loops, so tests must share the loop their fixtures were created on.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
